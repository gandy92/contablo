# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # Private wordlist check, see scripts/check-wordlist.sh
  - repo: local
    hooks:
      - id: check-wordlist-files
        name: check private wordlist (files)
        entry: scripts/check-wordlist.sh files
        language: unsupported_script
        require_serial: true
        verbose: true
      - id: check-wordlist-ident
        name: check private wordlist (identity)
        entry: scripts/check-wordlist.sh ident
        language: unsupported_script
        pass_filenames: false
        always_run: true
        verbose: true
      - id: check-wordlist-msg
        name: check private wordlist (commit message)
        entry: scripts/check-wordlist.sh msg
        language: unsupported_script
        stages: [commit-msg]
        verbose: true
      - id: check-wordlist-push
        name: check private wordlist (push)
        entry: scripts/check-wordlist.sh push
        language: unsupported_script
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        verbose: true

  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        args: [--safe]

  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        language_version: python3

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: debug-statements
        language_version: python3

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black", "--filter-files", "--force-single-line-imports", "--case-sensitive", "--skip-gitignore"]

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.1
    hooks:
      - id: pyupgrade
        args: [--py311-plus]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        files: ^src/
        args: []

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
